/* ============================================================
 * 快捷操作引擎（Actions）
 *   registerActionType(type, handler): 注册自定义动作类型
 *   definePlugin({kind,id,name,icon,register}): 自定义 JS 显式声明入口
 *   ActionsEngine.loadAll: 加载 + 校验 + 收集错误（分"JS 注册"与"JSON 校验"两阶段）
 *   ActionsEngine.execute: 按顺序执行动作
 * 内置动作: toast / delay / copy-text / open-url / open-folder / open-app / launch-app
 * ============================================================ */
const ActionTypes = {};
// 由自定义 JS 注册的动作类型（重新加载时撤销；内建动作类型永不撤销）
const PluginActionTypes = new Set();

function registerActionType(type, handler) {
  if (typeof type !== 'string' || !type.trim()) {
    reportPluginError('动作类型注册', 'registerActionType 的 type 必须是非空字符串', '例如 registerActionType("my-action", async (act) => { ... })');
    return;
  }
  if (typeof handler !== 'function') {
    reportPluginError('动作类型注册', '动作类型 "' + type + '" 的 handler 不是函数', '第二个参数必须是 (act, ctx) => {...} 形式的函数');
    return;
  }
  if (!(type in ActionTypes) && _pluginSource) PluginActionTypes.add(type);
  ActionTypes[type] = handler;
}

/* 自定义 JS 的显式声明入口（definePlugin）。
 * 不做隔离：插件仍与页面同上下文、全功能；此入口只负责"名实相符"与可检查。
 * 老写法 registerActionType(...) 仍然完全可用。
 *
 * kind 的三种取值（声明了就必须做到，否则报错）：
 *   action  —— 只提供动作类型给 .json 使用（可注册多个 type，不可注册 app）
 *   app     —— 注册一个可开窗的应用（必须注册恰好一个，且 id 与 def.id 一致）
 *   service —— 静默后台服务：不注册图标、不进网格、不算 action，start() 里悄悄生效
 */
function makeDefinePlugin(fileName) {
  return function definePlugin(def) {
    if (!def || typeof def !== 'object' || Array.isArray(def)) {
      reportPluginError('插件声明', 'definePlugin 的参数必须是对象', '传入 { kind: "action"|"app"|"service", ... }');
      return;
    }
    const kind = String(def.kind || '').toLowerCase();
    if (kind !== 'action' && kind !== 'app' && kind !== 'service') {
      reportPluginError('插件声明', 'kind 必须是 "action"、"app" 或 "service"（收到 "' + (def.kind || '') + '"）',
        'action = 给 .json 提供动作类型；app = 注册可开窗应用；service = 后台静默服务');
      return;
    }
    // service 用 start，其余用 register
    const entryName = kind === 'service' ? 'start' : 'register';
    if (typeof def[entryName] !== 'function') {
      reportPluginError('插件声明', '缺少 ' + entryName + ' 函数',
        kind === 'service'
          ? '添加 start(api) { ... }，在里写启动时要静默执行的代码'
          : '添加 register(api) { api.registerActionType(...) / api.registerApp(...) }');
      return;
    }
    if ((kind === 'app' || kind === 'service') && (typeof def.id !== 'string' || !def.id.trim())) {
      reportPluginError('插件声明', 'kind 为 "' + kind + '" 时必须提供字符串 id', '添加 id: "' + (kind === 'service' ? 'my-service' : 'myapp') + '"');
      return;
    }

    // service 的开关状态：存"已禁用"集合，这样新插件默认启用
    if (kind === 'service' && !State.settings.disabledServices) State.settings.disabledServices = [];

    // 清理栈：插件登记的所有副作用，在"关闭开关"或"重新加载"时统一撤销
    const cleanupFns = [];
    let registeredAppCount = 0;
    let registeredTypeCount = 0;
    // 服务的动态状态文本（如"当前：保持活跃"），由 api.setStatus() 更新
    const svcState = { statusText: '' };

    const api = {
      registerActionType: function (type, handler) {
        registeredTypeCount++;
        registerActionType(type, handler);
      },
      /* 更新在"后台服务"列表里显示的状态文字（仅 service 有意义） */
      setStatus: function (text) {
        svcState.statusText = String(text == null ? '' : text);
        try { if (typeof refreshServicePanel === 'function') refreshServicePanel(); } catch (e) {}
      },
      getStatus: function () { return svcState.statusText; },
      registerApp: function (app) {
        registeredAppCount++;
        // 补全元数据后注册，并记录属于哪个插件（便于重新加载时撤销）
        const merged = Object.assign({}, {
          id: def.id || (app && app.id),
          name: def.name || (app && app.name),
          icon: def.icon || (app && app.icon) || '🧩',
          describe: def.describe
        }, app || {});
        // id 不一致会让 .json 的 launch-app 引用到意料之外的应用，必须提示
        if (def.id && app && app.id && app.id !== def.id) {
          reportPluginError('插件声明', 'definePlugin.id("' + def.id + '") 与 registerApp.id("' + app.id + '") 不一致',
            '两处写同一个 id，否则 .json 里 launch-app 的 appId 会难以对应');
        }
        const before = merged.id && AppRegistry[merged.id];
        registerApp(merged);
        if (merged.id && !before && AppRegistry[merged.id] === merged && !BuiltinAppIds.has(merged.id)) {
          if (!ActionsEngine._pluginAppIds) ActionsEngine._pluginAppIds = [];
          if (ActionsEngine._pluginAppIds.indexOf(merged.id) < 0) ActionsEngine._pluginAppIds.push(merged.id);
        }
      },
      /* service 专用：登记一个清理函数，关闭开关/重新加载时调用 */
      onCleanup: function (fn) {
        if (typeof fn !== 'function') {
          reportPluginError('插件声明', 'onCleanup 的参数必须是函数', '传入 () => { ... }，用于撤销 start() 里注册的监听/定时器');
          return;
        }
        cleanupFns.push(fn);
      },
      toast: toast,
      pluginFile: fileName
    };

    // ---- service：登记到服务表，按开关决定是否启动 ----
    if (kind === 'service') {
      const svc = {
        id: def.id.trim(),
        name: def.name || def.id,
        icon: def.icon || '⚙️',
        describe: def.describe || '',
        file: fileName,
        def: def,
        api: api,
        cleanupFns: cleanupFns,
        state: svcState,       // 动态状态文本容器（api.setStatus 更新）
        running: false
      };
      const dup = (ActionsEngine.services || []).find(s => s.id === svc.id);
      if (dup) {
        reportPluginError('服务声明', '服务 id "' + svc.id + '" 与 ' + dup.file + ' 重复，本次被忽略', '换一个不同的 id');
        return;
      }
      if (!ActionsEngine.services) ActionsEngine.services = [];
      ActionsEngine.services.push(svc);
      return;   // service 不参与 action/app 的契约核对
    }

    // ---- action / app ----
    try {
      def.register(api);
    } catch (e) {
      reportPluginError('插件执行', String(e && e.message || e), '检查 register(api) 内部代码');
      return;
    }

    // 契约核对：声明什么就应当做到什么，否则就是"名实不符"
    if (kind === 'action' && registeredAppCount > 0) {
      reportPluginError('插件声明', 'kind 为 "action" 却调用了 registerApp',
        '该插件要注册应用，应把 kind 改为 "app"');
    }
    if (kind === 'app' && registeredAppCount === 0) {
      reportPluginError('插件声明', 'kind 为 "app" 但没有注册任何应用',
        '在 register(api) 里调用 api.registerApp({ render(body) { ... } })');
    }
    if (kind === 'action' && registeredTypeCount === 0 && registeredAppCount === 0) {
      reportPluginError('插件声明', 'kind 为 "action" 但没有注册任何动作类型',
        '在 register(api) 里调用 api.registerActionType("my-type", async (act) => { ... })');
    }
  };
}

/* 供服务插件刷新"后台服务"面板（由「快捷操作」窗口渲染时登记） */
let refreshServicePanel = null;

const ActionsEngine = {
  loadedActions: [],
  errors: [],
  customJsDir: '',
  services: [],          // kind:'service' 的后台服务（见 startService/stopService）

  /* ---------- 后台服务（kind: 'service'）---------- */

  /* 服务是否被用户关闭（存"已禁用"集合，新服务默认启用） */
  isServiceDisabled(id) {
    const list = (State.settings && State.settings.disabledServices) || [];
    return list.indexOf(id) >= 0;
  },

  /* 启动一个服务（登记清理栈、执行 start()） */
  startService(svc) {
    if (!svc || svc.running) return;
    try {
      svc.def.start(svc.api);
      svc.running = true;
    } catch (e) {
      // 启动失败：明确报错并标记未生效，避免"静默失效没人知道"
      svc.running = false;
      this.errors.push({
        file: svc.file, type: '后台服务',
        reason: '服务 "' + svc.name + '" 启动失败: ' + String(e && e.message || e),
        fix: '检查 start(api) 内部代码'
      });
    }
  },

  /* 停止一个服务：执行清理栈，撤销它注册的所有副作用 */
  stopService(svc) {
    if (!svc || !svc.running) return;
    (svc.cleanupFns || []).slice().forEach(fn => {
      try { fn(); } catch (e) {
        this.errors.push({ file: svc.file, type: '后台服务', reason: '服务 "' + svc.name + '" 清理失败: ' + String(e && e.message || e), fix: '检查 onCleanup 注册的函数' });
      }
    });
    // 注意：必须清空数组内容，不能替换引用。
    // 插件里的 api.onCleanup 闭包捕获的是这个数组本身，
    // 若此处 svc.cleanupFns = []，闭包仍会往旧数组推，导致下次停止时清不到东西。
    if (svc.cleanupFns) svc.cleanupFns.length = 0;
    svc.running = false;
  },

  /* 切换服务开关（写设置 + 立即启停） */
  setServiceEnabled(id, enabled) {
    const list = (State.settings.disabledServices || []).slice();
    const i = list.indexOf(id);
    if (enabled && i >= 0) list.splice(i, 1);
    else if (!enabled && i < 0) list.push(id);
    State.settings.disabledServices = list;
    const svc = (this.services || []).find(s => s.id === id);
    if (enabled) this.startService(svc);
    else this.stopService(svc);
  },

  /* 撤销所有服务（重新加载前调用） */
  unloadServices() {
    (this.services || []).forEach(svc => this.stopService(svc));
    this.services = [];
  },

  /* 默认动作目录（Electron 下为用户数据目录内的 workbench-actions） */
  async getDefaultDir() {
    if (IS_ELECTRON) {
      const r = await window.electronAPI.actionsEnsureDefaultDir();
      return r.ok ? r.dir : '';
    }
    return 'workbench-actions';
  },

  /* ---------- 加载 ----------
   * 分两个明确阶段，避免"依赖扫描顺序碰巧正确"：
   *   阶段 1  执行所有 .js（注册动作类型 / 注册应用 / 登记后台服务），收集错误
   *   阶段 2  读取并校验所有 .json（此时 ActionTypes 已完整，不会误判"未知动作类型"）
   *   阶段 3  启动未被关闭的后台服务
   */
  async loadAll(customJsDir) {
    this.loadedActions = [];
    this.errors = [];
    this.customJsDir = customJsDir || '';
    // 重新加载：先撤销上一次由自定义 JS 注册的应用与后台服务
    this.unloadPluginApps();
    this.unloadServices();

    let dir = '';
    if (IS_ELECTRON) {
      const s = State.settings;
      dir = (s.actionsDir && s.actionsDir.trim()) || await this.getDefaultDir();
    }

    // 收集所有 .js 文件（来自自定义 JS 目录 + 快捷操作目录）
    const jsFiles = [];
    if (this.customJsDir) {
      const r = await window.electronAPI.actionsReadFiles(this.customJsDir);
      if (r.ok) jsFiles.push(...r.files.filter(x => x.name.endsWith('.js')));
      else this.errors.push({ file: this.customJsDir, type: '自定义JS目录', reason: r.msg, fix: '检查自定义 Action JS 目录是否存在且可读' });
    }

    if (!dir) {
      this.errors.push({ file: '(目录)', type: '目录', reason: '未配置快捷操作目录', fix: '请在设置中填写快捷操作JSON目录' });
      // 目录缺失也要执行已收集到的自定义 JS（阶段 1 独立成立），并启动其中的后台服务
      for (const f of jsFiles) await this.loadCustomJsFile(f);
      this.startPendingServices();
      return;
    }

    let files;
    if (IS_ELECTRON) {
      const r = await window.electronAPI.actionsReadFiles(dir);
      if (!r.ok) {
        this.errors.push({ file: '(目录)', type: '目录', reason: r.msg, fix: '检查目录是否存在且可读' });
        for (const f of jsFiles) await this.loadCustomJsFile(f);
        this.startPendingServices();
        return;
      }
      files = r.files;
    } else {
      files = [];
    }

    // ===== 阶段 1：先执行全部 .js（注册动作类型 / 应用 / 登记后台服务）=====
    jsFiles.push(...files.filter(x => x.name.endsWith('.js')));
    for (const f of jsFiles) await this.loadCustomJsFile(f);

    // ===== 阶段 2：再校验全部 .json（此时 ActionTypes 已完整）=====
    for (const f of files.filter(x => x.name.endsWith('.json'))) {
      const parsed = await this.loadAndValidate(f);
      if (parsed) this.loadedActions.push(parsed);
    }

    // ===== 阶段 3：启动未被用户关闭的后台服务 =====
    this.startPendingServices();
  },

  /* 启动所有已登记且未被关闭的服务（所有加载路径都要走到这一步） */
  startPendingServices() {
    (this.services || []).forEach(svc => {
      if (this.isServiceDisabled(svc.id)) return;
      this.startService(svc);
    });
  },

  /* 撤销上一次由自定义 JS 注册的应用与动作类型（重新加载时调用，避免累积/旧窗口指向旧对象） */
  unloadPluginApps() {
    (this._pluginAppIds || []).forEach(id => {
      const app = AppRegistry[id];
      if (!app || BuiltinAppIds.has(id)) return;
      delete AppRegistry[id];
      // 关闭指向该应用的已有窗口
      Object.keys(WindowManager.windows).forEach(wid => {
        if (WindowManager.windows[wid].appId === id) WindowManager.close(wid);
      });
    });
    this._pluginAppIds = [];
    // 撤销插件注册的动作类型（内建类型不在 PluginActionTypes 里，不受影响）
    PluginActionTypes.forEach(t => { delete ActionTypes[t]; });
    PluginActionTypes.clear();
  },

  async loadCustomJsFile(f) {
    const prevSource = _pluginSource;
    _pluginSource = f.name;   // 注册期间的问题都归属到这个文件
    try {
      const r = await window.electronAPI.actionsReadText(f.path);
      if (!r.ok) throw new Error(r.msg);
      const fn = new Function('definePlugin', 'registerActionType', r.content);
      fn(makeDefinePlugin(f.name), registerActionType);
    } catch (e) {
      this.errors.push({ file: f.name, type: '自定义JS', reason: String(e.message || e), fix: '检查 JS 语法；可用 definePlugin({...}) 声明插件，或直接调用 registerActionType(type, handler)' });
    } finally {
      _pluginSource = prevSource;
    }
  },

  /* ---------- 加载并校验单个 json ---------- */
  async loadAndValidate(f) {
    let raw;
    try {
      const r = await window.electronAPI.actionsReadText(f.path);
      if (!r.ok) throw new Error(r.msg);
      raw = r.content;
    } catch (e) {
      this.errors.push({ file: f.name, type: '读取', reason: String(e.message || e), fix: '确保文件可读' });
      return null;
    }
    let def;
    try { def = JSON.parse(raw); }
    catch (e) {
      this.errors.push({ file: f.name, type: 'JSON', reason: 'JSON 解析失败: ' + e.message, fix: '检查 JSON 语法（逗号、引号、大括号是否完整）' });
      return null;
    }
    const issues = this.validate(def);
    if (issues.length) {
      issues.forEach(issue => this.errors.push(Object.assign({ file: f.name, type: '校验' }, issue)));
      return null;
    }
    return def;
  },

  validate(def) {
    const issues = [];
    if (!def || typeof def !== 'object' || Array.isArray(def)) { issues.push({ reason: '不是对象', fix: 'JSON 顶层应为 { ... } 对象' }); return issues; }
    if (typeof def.id !== 'string' || !def.id.trim()) issues.push({ reason: '缺少必填字段 id', fix: '添加 "id": "标识"' });
    if (typeof def.name !== 'string' || !def.name.trim()) issues.push({ reason: '缺少必填字段 name', fix: '添加 "name": "显示名称"' });
    if (typeof def.icon !== 'string' || !def.icon.trim()) issues.push({ reason: '缺少必填字段 icon', fix: '添加 "icon": "📁" 或任意 emoji' });
    if (def.describe !== undefined && typeof def.describe !== 'string') issues.push({ reason: 'describe 应为字符串', fix: '把描述写成文字' });
    if (!Array.isArray(def.actions) || def.actions.length === 0) issues.push({ reason: 'actions 必须是非空数组', fix: '在 actions 数组里写至少一个动作' });
    if (Array.isArray(def.actions)) {
      def.actions.forEach((a, i) => {
        if (!a || typeof a !== 'object') { issues.push({ reason: 'actions[' + i + '] 不是对象', fix: '每个动作应为 { ... }' }); return; }
        if (typeof a.type !== 'string' || !a.type) issues.push({ reason: 'actions[' + i + '] 缺少 type', fix: '为第 ' + (i+1) + ' 个动作添加 type' });
        else if (!(a.type in ActionTypes)) issues.push({
          reason: 'actions[' + i + '] 未知动作类型 "' + a.type + '"',
          fix: '若该类型由自定义 JS 提供：请检查那个 .js 是否加载成功（见下方错误）；否则检查类型拼写'
        });
        if ((a.type === 'open-folder' || a.type === 'open-app') && (!a.path || typeof a.path !== 'string' || !a.path.trim()))
          issues.push({ reason: 'actions[' + i + '] 缺少 path', fix: '为 open-folder/open-app 添加 path' });
        if (a.type === 'launch-app' && (!a.appId || typeof a.appId !== 'string' || !a.appId.trim()))
          issues.push({ reason: 'actions[' + i + '] 缺少 appId', fix: '为 launch-app 添加 appId，例如 "appId": "myapp"' });
        if (a.type === 'open-url' && (!a.url || typeof a.url !== 'string' || !a.url.trim()))
          issues.push({ reason: 'actions[' + i + '] 缺少 url', fix: '为 open-url 添加 url' });
        if (a.type === 'copy-text' && !a.text) issues.push({ reason: 'actions[' + i + '] 缺少 text', fix: '为 copy-text 添加 text' });
        if (a.type === 'delay' && (typeof a.ms !== 'number' || a.ms < 0)) issues.push({ reason: 'actions[' + i + '] 缺少合法 delay.ms', fix: '为 delay 添加 ms 毫秒数' });
      });
    }
    return issues;
  },

  /* ---------- 执行 ---------- */
  async execute(actionDef) {
    for (let i = 0; i < (actionDef.actions || []).length; i++) {
      const act = actionDef.actions[i];
      try { await this.runAction(act, actionDef); }
      catch (e) { toast('[' + actionDef.name + '] 动作' + (i+1) + '(' + act.type + ') 失败: ' + (e.message || e), 3200); }
    }
  },

  async runAction(act, actionDef) {
    const handler = ActionTypes[act.type];
    if (!handler) throw new Error('未知动作类型: ' + act.type);
    const result = await handler(act, { actionDef, engine: this });
    if (result === false) throw new Error('动作执行返回失败');
  },

  /* 错误汇总弹窗 */
  showErrorSummary() {
    if (!this.errors.length) return;
    WindowManager.create('actionsErrorReport');
  }
};

/* ---------- 内置动作类型注册 ---------- */
registerActionType('toast', async (act) => { toast(act.text || '🔔'); });
registerActionType('delay', async (act) => { await new Promise(r => setTimeout(r, act.ms || 0)); });
registerActionType('copy-text', async (act) => {
  if (IS_ELECTRON) await window.electronAPI.clipCopyText(act.text);
  else { try { await navigator.clipboard.writeText(act.text); } catch (e) { throw e; } }
  toast('已复制: ' + String(act.text).slice(0, 20));
});
registerActionType('open-url', async (act) => {
  if (IS_ELECTRON) {
    const r = await window.electronAPI.actionsOpenExternal(act.url);
    if (!r.ok) throw new Error(r.msg);
  } else window.open(act.url, '_blank');
});
registerActionType('open-folder', async (act) => {
  if (IS_ELECTRON) {
    const r = await window.electronAPI.actionsOpenFolder(act.path);
    if (!r.ok) throw new Error(r.msg);
  } else throw new Error('浏览器模式不支持打开文件夹');
});
registerActionType('open-app', async (act) => {
  if (IS_ELECTRON) {
    const exe = /\.exe$/i.test(act.path);
    const r = await window.electronAPI.actionsLaunchApp(act.path, exe);
    if (!r.ok) throw new Error(r.msg);
  } else throw new Error('浏览器模式不支持打开应用');
});
/* 打开一个已注册的应用/窗口（由自定义 JS 的 kind:"app" 注册，或任何内建应用）。
 * 说明：appId 是否已注册在"执行期"检查，不在加载期硬校验 —— 因为 JS 与 JSON 的
 * 加载顺序不保证，加载期校验会误判为"未知类型"。 */
registerActionType('launch-app', async (act) => {
  const id = typeof act.appId === 'string' ? act.appId.trim() : '';
  if (!id) throw new Error('launch-app 缺少 appId');
  if (!getApp(id)) throw new Error('未找到应用 "' + id + '"（是否对应的自定义 JS 加载失败？）');
  WindowManager.create(id);
});

function registerActionApps() {
  // 无需再注册桌面应用；网格窗口直接从 ActionsEngine.loadedActions 读取
}

/* ---------- 快捷操作总入口（网格） ---------- */
registerApp({
  id: 'actionsErrorReport',
  name: '快捷操作',
  icon: '🖱️',
  w: 680, h: 520,
  render(body, meta) {
    const renderAll = () => {

        '</div>';

      // 网格：每个操作一个格子
      const grid = body.querySelector('#act-grid');

        tile.innerHTML = '<div style="font-size:30px;line-height:1;">'+esc(action.icon||'⚡')+'</div><div style="font-size:12px;word-break:break-all;">'+esc(action.name)+'</div>';

      });

          const failed = !svc.running && enabled;
          row.innerHTML =
            '<div style="flex:1;min-width:0;">' +

                (failed ? ' <span style="color:#e81123;font-size:11px;">（启动失败）</span>' : '') + '</div>' +

              (svc.state && svc.state.statusText

          });
          row.appendChild(sw);
          svcBox.appendChild(row);
        });
      }

      // 错误列表
      const errBox = body.querySelector('#act-errs');
      if (errBox) {
        errs.forEach(er => {
          const d = document.createElement('div');
          d.style.cssText = 'border:1px solid #e8112366;background:#e8112311;border-radius:6px;padding:6px;margin-bottom:5px;font-size:12px;';

            '<div style="color:var(--text-dim);">建议：'+esc(er.fix||'')+'</div>';
          errBox.appendChild(d);
        });
      }

      // 重新加载
      const reloadBtn = body.querySelector('#act-reload');
      if (reloadBtn) reloadBtn.addEventListener('click', async () => {
        toast('正在重新加载快捷操作…');
        const hadPluginApps = (ActionsEngine._pluginAppIds || []).length > 0;
        await ActionsEngine.loadAll(State.settings.actionsJsDir);
        renderAll();
        const errs = ActionsEngine.errors.length;
        const svcCount = (ActionsEngine.services || []).filter(s => s.running).length;
        toast('重新加载完成：' + ActionsEngine.loadedActions.length + ' 个操作' +
          (svcCount ? ('，' + svcCount + ' 个后台服务生效') : '') +
          (errs ? ('，' + errs + ' 个错误（见下方）') : '') +
          (hadPluginApps ? '；已重置自定义应用窗口' : ''));
      });
      // 打开目录
      const openBtn = body.querySelector('#act-opendir');
      if (openBtn) openBtn.addEventListener('click', async () => {
        if (!IS_ELECTRON) { toast('仅 Electron 下可用'); return; }
        const dir = (State.settings.actionsDir && State.settings.actionsDir.trim()) || (await window.electronAPI.actionsEnsureDefaultDir()).dir;
        const r = await window.electronAPI.actionsOpenFolder(dir);
        if (!r.ok) toast('打开失败: ' + r.msg);
      });
    };
    renderAll();
    meta._refresh = renderAll;
    // 登记刷新函数，供服务插件通过 api.setStatus() 实时更新显示
    refreshServicePanel = renderAll;
    meta.cleanup = () => { if (refreshServicePanel === renderAll) refreshServicePanel = null; };
  }
});

const Clips = {

      window.electronAPI.clipSetPath(s.clipPath).then(r => {
        if (r && r.ok) {

      });

      window.electronAPI.clipStop();
    }
  },
  async init() {
    if (!IS_ELECTRON) return;
    const s = State.settings;
    if (s.clipPath) {
      await window.electronAPI.clipSetPath(s.clipPath);
      window.electronAPI.clipStart();
    }
    window.electronAPI.onClipUpdate(items => { Clips.items = items; Clips.refresh(); });
    Clips.items = await window.electronAPI.clipGetItems();
    Clips.refresh();
  },

      const el = document.createElement('div');
      el.className = 'clip-item';
      el.innerHTML = `
        ${item.type === 'image'
          ? `<img class="clip-thumb" src="file:///${item.imgPath.replace(/\\/g,'/')}" onerror="this.style.display='none'">`
          : ''}
        <div class="clip-body">
          <div class="clip-text">${item.type === 'image' ? '🖼️ 图片' : esc(item.text || '')}</div>
          <div class="clip-meta">${new Date(item.time).toLocaleTimeString()} ${item.pinned ? '· 📌 固定' : ''}</div>

          <button class="c-copy" title="复制">📋</button>

      el.querySelector('.c-copy').addEventListener('click', e => { e.stopPropagation(); Clips.copy(item); });

      el.querySelector('.c-del').addEventListener('click', e => { e.stopPropagation(); window.electronAPI.clipDelete(item.id); });
      el.addEventListener('click', () => Clips.copy(item));

  copy(item) {

      if (IS_ELECTRON) window.electronAPI.clipDelete(item.id);
    toast('已复制到剪贴板');
  }
};

/* ---------- 计算器（带历史 + 完整算式显示） ---------- */
const Calc = {
  display: '',
  prev: null,
  op: null,
  waitingOperand: false,
  lastResult: null,
  history: [],

  // 生成显示区的完整算式文本
  formula() {
    if (this.op != null) {
      return `${this.prev || ''} ${this.op} ${this.display}`.replace(/\s+/g, ' ').trim();
    }
    if (this.lastResult != null) return this.lastResult;
    return this.display || '0';
  },
  renderDisplay(el) { el.textContent = this.formula(); },

  inputDigit(d, el) {
    if (this.waitingOperand) { this.display = ''; this.waitingOperand = false; this.lastResult = null; }
    if (d === '.' && this.display.includes('.')) return;
    this.display += d;
    this.renderDisplay(el);
  },
  setOp(op, el) {
    if (this.display === '' && this.prev == null) return;
    if (this.op && !this.waitingOperand && this.display !== '') this.calc();
    this.prev = this.display === '' ? this.prev : this.display;
    this.op = op;
    this.display = '';
    this.waitingOperand = true;
    this.lastResult = null;
    this.renderDisplay(el);
  },
  calc() {
    if (this.op == null || this.prev == null || this.display === '') return;
    const a = parseFloat(this.prev), b = parseFloat(this.display);
    let r;
    switch (this.op) {
      case '+': r = a + b; break;
      case '-': r = a - b; break;
      case '*': r = a * b; break;
      case '/': r = b === 0 ? '错误' : a / b; break;
      default: return;
    }
    const expr = `${this.prev} ${this.op} ${this.display} = ${r}`;
    this.history.unshift(expr);
    if (this.history.length > 100) this.history.pop();
    this.lastResult = expr;
    this.prev = null; this.op = null; this.display = String(r); this.waitingOperand = true;
  },
  renderHistory(box) {
    if (!box) return;
    box.innerHTML = '';
    if (!this.history.length) { box.innerHTML = '<div class="title" style="color:var(--text-dim);">暂无记录</div>'; return; }
    box.innerHTML = '<div class="title">历史</div>';
    this.history.forEach(ex => {
      const d = document.createElement('div');
      d.className = 'h-item';
      d.textContent = ex;
      d.addEventListener('click', () => {
        const idx = ex.lastIndexOf('=');
        const val = ex.slice(idx + 1).trim();
        if (!isNaN(parseFloat(val))) this.display = String(parseFloat(val));
        this.lastResult = null; this.prev = null; this.op = null; this.waitingOperand = false;
      });
      box.appendChild(d);
    });
  }
};

registerApp({
  id: 'calc',
  name: '计算器',
  icon: '🧮',
  w: 360, h: 300,
  render(body, meta) {
    body.innerHTML = `
      <div class="calc-wrap">
        <div class="calc-main">
          <div class="calc-display" id="calc-display">0</div>
          <div class="calc-grid">
            <button data-a="C">C</button><button data-a="±">±</button><button data-a="%">%</button><button data-a="/" class="op">÷</button>
            <button data-a="7">7</button><button data-a="8">8</button><button data-a="9">9</button><button data-a="*" class="op">×</button>
            <button data-a="4">4</button><button data-a="5">5</button><button data-a="6">6</button><button data-a="-" class="op">−</button>
            <button data-a="1">1</button><button data-a="2">2</button><button data-a="3">3</button><button data-a="+" class="op">+</button>
            <button data-a="0">0</button><button data-a=".">.</button><button data-a="=" class="eq">=</button>
          </div>
        </div>
        <div class="calc-history" id="calc-history"></div>
      </div>`;
    const disp = $('#calc-display', body);
    const archBox = $('#calc-history', body);
    Calc.renderHistory(archBox);
    $$('button', body).forEach(b => {
      b.addEventListener('click', () => {
        const a = b.dataset.a;
        if (a === 'C') { Calc.display = ''; Calc.prev = null; Calc.op = null; Calc.waitingOperand = false; Calc.lastResult = null; Calc.renderDisplay(disp); }
        else if (a === '=') { Calc.calc(); Calc.renderDisplay(disp); }
        else if (['+','-','*','/'].includes(a)) { Calc.setOp(a, disp); }
        else if (a === '±') { Calc.display = Calc.display ? String(-parseFloat(Calc.display)) : ''; Calc.renderDisplay(disp); }
        else if (a === '%') { Calc.display = Calc.display ? String(parseFloat(Calc.display)/100) : ''; Calc.renderDisplay(disp); }
        else Calc.inputDigit(a, disp);
        Calc.renderHistory(archBox);
      });
    });
  }
});

        if (st.current) {

        } else {
          meta.transferBusy = false;
          $('#ts-progress').style.display = 'none';

    /* ---------- 聊天消息渲染 ---------- */
    let msgs = [];

    function fmtSize(n) {
      n = Number(n) || 0;
      if (n < 1024) return n + ' B';
      if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
      if (n < 1073741824) return (n/1048576).toFixed(1) + ' MB';
      return (n/1073741824).toFixed(2) + ' GB';
    }
    function fmtTime(t) {
      try { return new Date(t).toLocaleString(); } catch (e) { return ''; }
    }

    function copyText(text) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => toast('已复制'), () => toast('复制失败'));
        } else {
          const ta = document.createElement('textarea');
          ta.value = text; document.body.appendChild(ta); ta.select();
          document.execCommand('copy'); ta.remove(); toast('已复制');
        }
      } catch (e) { toast('复制失败：' + (e.message || e)); }
    }

    /* 点图片放大查看 */
    let lightboxEl = null;
    function closeLightbox() {
      if (lightboxEl && lightboxEl.parentNode) lightboxEl.parentNode.removeChild(lightboxEl);
      lightboxEl = null;
    }
    function openLightbox(dataUrl) {
      closeLightbox();
      lightboxEl = document.createElement('div');
      lightboxEl.className = 'ts-lightbox';
      const im = document.createElement('img');
      im.src = dataUrl;
      lightboxEl.appendChild(im);
      lightboxEl.addEventListener('click', closeLightbox);
      document.body.appendChild(lightboxEl);
    }

    function renderMessages() {
      const box = $('#ts-msgs');
      if (!box) return;
      if (!msgs.length) {
        box.innerHTML = '<div class="ts-empty">还没有消息<br>把手机连到同一 WiFi 打开上面的地址，或在这里发送内容</div>';
        return;
      }
      box.innerHTML = '';
      // msgs 是新→旧，聊天按旧→新显示
      msgs.slice().reverse().forEach(m => {
        const mine = m.dir === 'pc';
        const el = document.createElement('div');
        el.className = 'ts-bub ' + (mine ? 'mine' : 'theirs');

        let html = '<div class="who">' + (mine ? '我（电脑）' : '手机') + '</div>';
        if (m.kind === 'text') {
          html += '<div class="body"></div>';
        } else {
          const isImg = !!(m.name && /\.(png|jpe?g|gif|webp|bmp)$/i.test(m.name));
          html += '<div><span class="fname">📄 ' + esc(m.name || '(文件)') + '</span></div>' +
                  '<div class="meta">' + fmtSize(m.size) + '</div>' +
                  (isImg && m.path ? '<div class="imgwrap"><span class="imgload">预览加载中…</span></div>' : '');
        }
        html += '<div class="meta">' + fmtTime(m.time) + '</div>';
        html += '<div class="acts"></div>';
        el.innerHTML = html;

        // 文字用 textContent 写入，避免任何 HTML 注入
        if (m.kind === 'text') el.querySelector('.body').textContent = m.text == null ? '' : String(m.text);

        // 图片文件：异步加载清晰预览（0.5x），点击可放大
        const iw = el.querySelector('.imgwrap');
        if (iw && m.path) {
          window.electronAPI.transferImagePreview(m.path, 'preview').then(r => {
            if (!r || !r.ok) {
              iw.innerHTML = '<span class="imgfail">（无法预览此图片）</span>';
              return;
            }
            const im = document.createElement('img');
            im.src = r.dataUrl;
            im.alt = m.name || '';
            im.title = '点击放大';
            im.addEventListener('click', (ev) => { ev.stopPropagation(); openLightbox(r.dataUrl); });
            iw.innerHTML = '';
            iw.appendChild(im);
          }).catch(() => { iw.innerHTML = '<span class="imgfail">（预览失败）</span>'; });
        }

        const acts = el.querySelector('.acts');

        if (m.kind === 'text') {
          const a = document.createElement('span');
          a.className = 'act'; a.textContent = '复制文字';
          a.addEventListener('click', () => copyText(m.text == null ? '' : String(m.text)));
          acts.appendChild(a);
        } else if (m.path) {
          const a1 = document.createElement('span');
          a1.className = 'act'; a1.textContent = '打开';
          a1.addEventListener('click', () => window.electronAPI.openPath(m.path));
          acts.appendChild(a1);
          const a2 = document.createElement('span');
          a2.className = 'act'; a2.textContent = '定位';
          a2.addEventListener('click', () => window.electronAPI.showInFolder(m.path));
          acts.appendChild(a2);
          const a3 = document.createElement('span');
          a3.className = 'act'; a3.textContent = '复制路径';
          a3.addEventListener('click', () => copyText(m.path));
          acts.appendChild(a3);
          // 文件名双击直接打开
          el.querySelector('.fname').addEventListener('dblclick', () => window.electronAPI.openPath(m.path));
        }

        // 右键菜单：快捷复制
        el.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          const items = [];
          if (m.kind === 'text') {
            items.push({ label: '📋 复制文字', run: () => copyText(m.text == null ? '' : String(m.text)) });
          } else {
            const isImg = !!(m.name && /\.(png|jpe?g|gif|webp|bmp)$/i.test(m.name));
            if (m.path && isImg) {
              items.push({ label: '🔍 查看大图', run: () => {
                window.electronAPI.transferImagePreview(m.path, 'preview').then(r => {
                  if (r && r.ok) openLightbox(r.dataUrl);
                  else toast('无法预览：' + ((r && r.msg) || ''));
                });
              } });
            }
            if (m.path) {
              items.push({ label: '📋 复制文件路径', run: () => copyText(m.path) });
              items.push({ label: '📂 打开文件', run: () => window.electronAPI.openPath(m.path) });
              items.push({ label: '🗂 定位到文件夹', run: () => window.electronAPI.showInFolder(m.path) });
            }
            if (m.name) items.push({ label: '📋 复制文件名', run: () => copyText(m.name) });
          }
          showContextMenu(e.clientX, e.clientY, items);
        });

        box.appendChild(el);
      });
      box.scrollTop = box.scrollHeight;
    }

    /* 简易右键菜单 */
    let ctxEl = null;
    function hideContextMenu() {
      if (ctxEl && ctxEl.parentNode) ctxEl.parentNode.removeChild(ctxEl);
      ctxEl = null;
    }
    function showContextMenu(x, y, items) {
      hideContextMenu();
      if (!items || !items.length) return;
      ctxEl = document.createElement('div');
      ctxEl.id = 'ts-ctxmenu';
      ctxEl.style.cssText = 'position:fixed;z-index:99999;background:#2a2a35;border:1px solid #444;' +
        'border-radius:6px;padding:4px;box-shadow:0 6px 20px rgba(0,0,0,.4);min-width:150px;font-size:13px;';
      items.forEach(it => {
        const d = document.createElement('div');
        d.textContent = it.label;
        d.style.cssText = 'padding:6px 10px;cursor:pointer;border-radius:4px;color:#eee;white-space:nowrap;';
        d.addEventListener('mouseenter', () => { d.style.background = '#3a3a4a'; });
        d.addEventListener('mouseleave', () => { d.style.background = 'transparent'; });
        d.addEventListener('click', () => { hideContextMenu(); it.run(); });
        ctxEl.appendChild(d);
      });
      ctxEl.style.left = Math.min(x, window.innerWidth - 170) + 'px';
      ctxEl.style.top = Math.min(y, window.innerHeight - 20 - items.length * 30) + 'px';
      document.body.appendChild(ctxEl);
      setTimeout(() => {
        const off = (ev) => { hideContextMenu(); document.removeEventListener('mousedown', off); };
        document.addEventListener('mousedown', off);
      }, 0);
    }

    async function refreshMessages() {
      try {
        const list = await window.electronAPI.transferGetMessages();
        msgs = Array.isArray(list) ? list : [];
        renderMessages();
      } catch (e) { /* ignore */ }
    }

    /* ---------- 发送 ---------- */
    async function sendCurrentText() {
      const ta = $('#ts-text');
      const v = ta ? ta.value : '';
      if (!v.trim()) { toast('请输入内容'); return; }
      const r = await window.electronAPI.transferSendText(v);
      if (!r || !r.ok) { toast('发送失败：' + ((r && r.msg) || '')); return; }
      ta.value = '';
      await refreshMessages();
      toast('已发送到手机');
    }

    async function pickAndSendFiles() {
      // selectFiles 返回字符串路径数组（已支持多选），取消时返回 null
      const files = await window.electronAPI.selectFiles();
      if (!files || !files.length) return;
      const paths = files.map(f => (typeof f === 'string' ? f : (f && f.path))).filter(Boolean);
      if (!paths.length) return;
      const r = await window.electronAPI.transferSendFiles(paths);
      await refreshMessages();
      if (r && r.failed && r.failed.length) toast('部分失败：' + r.failed.join('；'), 3500);
      else toast('已加入发送列表（' + ((r && r.sent) ? r.sent.length : paths.length) + ' 个）');
    }

    /* 粘贴：支持文字与文件 */
    async function handlePaste(e) {
      const dt = e.clipboardData;
      if (!dt) return;
      // 优先处理文件
      const files = [];
      if (dt.files && dt.files.length) {
        for (const f of dt.files) files.push(f);
      }
      if (files.length) {
        const paths = files.map(f => {
          // Electron 里 File 对象带 path 属性
          return f.path || null;
        }).filter(Boolean);
        if (paths.length) {
          e.preventDefault();
          const r = await window.electronAPI.transferSendFiles(paths);
          await refreshMessages();
          toast('已加入发送列表（' + paths.length + ' 个）');
          return;
        }
        // 浏览器式 File（无 path）：走上传到本机接收目录的方式不可用，提示用户
        e.preventDefault();
        toast('无法获取该文件的路径，请用“📎 发送文件”选择', 3500);
        return;
      }
      // 文字交给 textarea 默认行为
    }

    const ta = $('#ts-text');
    ta.addEventListener('keydown', (e) => {
      // Ctrl+Enter 发送（Enter 保留换行）
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); sendCurrentText(); }
    });
    ta.addEventListener('paste', handlePaste);

    $('#ts-send-text').addEventListener('click', sendCurrentText);
    $('#ts-send-file').addEventListener('click', pickAndSendFiles);
    $('#ts-clear').addEventListener('click', async () => {
      const r = await window.electronAPI.transferClearMessages();
      if (r && r.ok) { await refreshMessages(); toast('聊天记录已清除（已接收的文件不会被删除）'); }
    });

    /* ---------- 事件订阅 ---------- */
    window.electronAPI.onTransferMessageList((list) => {
      msgs = Array.isArray(list) ? list : [];
      renderMessages();
    });
    window.electronAPI.onTransferReceived((info) => {
      toast(info.isText ? '📩 收到手机发来的文字' : '📥 已收到文件：' + info.name);
    });

    refreshMessages();

    const shareDir = (s.transferShareDir && s.transferShareDir.trim()) || s.transferPath;
    window.electronAPI.transferStart(s.transferPort, s.transferPath, shareDir).then(res => {
      if (!res.ok) { $('#ts-status').textContent = '启动失败：' + (res.msg || ''); return; }
      render(res.status);
    });
    window.electronAPI.onTransferStatus(render);
    window.electronAPI.transferGetStatus().then(render);
  }
});

/* ============================================================
 * 快照系统（仅手动保存 / 导出 / 导入）
 * ============================================================ */
function persistAll(showToastMsg) {
  // 收集窗口状态
  State.windows = Object.values(WindowManager.windows).map(m => {
    const r = m.el.getBoundingClientRect();
    return { id: m.id, appId: m.appId, x: r.left, y: r.top, w: r.width, h: r.height, minimized: m.minimized, maximized: m.maximized };
  });
  // 浏览器模式下 objectURL 刷新后失效，保存时去掉 url，仅保留名称/路径等
  State.playlists.music = MusicPlayer.playlist.map(t => ({
    name: t.name,
    url: IS_ELECTRON ? (t.url || null) : null,   // 浏览器模式不存 objectURL
    dataUrl: t.dataUrl,
    path: t.path,
    cover: t.cover
  }));
  State.playlists.musicIndex = MusicPlayer.index;
  Store.save();
  if (showToastMsg) toast('✓ 快照已保存');
  return State;
}

function applyTheme() {
  const s = State.settings;
  const root = document.documentElement.style;
  root.setProperty('--font-family', s.fontFamily && s.fontFamily !== 'default' ? s.fontFamily : '"Segoe UI","Microsoft YaHei",system-ui,sans-serif');
  root.setProperty('--font-size', (s.fontSize || 15) + 'px');
}

function applyWallpaper() {
  const s = State.settings;
  if (s.wallpaper) {
    wallpaperEl.style.backgroundImage = `url(${s.wallpaper})`;
    desktopEl.style.background = 'transparent';
  } else {
    wallpaperEl.style.backgroundImage = '';
    desktopEl.style.background = 'var(--desktop-bg)';
  }
}

function exportSnapshot() {
  const data = JSON.stringify(persistAll(), null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'workbench-snapshot-' + new Date().toISOString().replace(/[:.]/g, '-') + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(a.href);
  toast('已导出快照文件');
}

function importSnapshot(file) {
  // 限制导入大小（最多 10MB）
  if (file.size > 10 * 1024 * 1024) {
    toast('导入失败：文件太大（超过 10MB）', 3500);
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      // 结构校验：必须是对象，且含必要字段
      if (!data || typeof data !== 'object' || Array.isArray(data)) {
        toast('导入失败：不是有效的快照文件', 3500);
        return;
      }
      const def = Store.defaultState();
      // 仅合并已知字段的合法类型
      const merged = Object.assign({}, def, data);
      if (Array.isArray(data.notes)) merged.notes = data.notes;
      if (Array.isArray(data.alarms)) merged.alarms = data.alarms;
      if (Array.isArray(data.fileArea)) merged.fileArea = data.fileArea;
      if (data.settings && typeof data.settings === 'object') merged.settings = Object.assign({}, def.settings, data.settings);
      // 逐字段合并回 State
      Object.keys(def).forEach(k => { if (k in merged) State[k] = merged[k]; });
      State.settings = merged.settings || def.settings;
      State.notes = Array.isArray(merged.notes) ? merged.notes : [];
      State.alarms = Array.isArray(merged.alarms) ? merged.alarms : [];
      State.fileArea = Array.isArray(merged.fileArea) ? merged.fileArea : [];
      // 清除现有便签 DOM 后重建
      Notes.els.forEach(m => m.el.remove());
      Notes.els.clear();
      applyTheme(); applyWallpaper(); renderDesktopIcons(); Notes.init(); MusicPlayer.renderPlaylist();
      toast('✓ 快照已导入');
    } catch (e) { toast('导入失败：' + e.message, 3500); }
  };
  reader.readAsText(file);
}

/* ---------- 提示音（WebAudio 生成） ---------- */
let beepCtx = null;
function beep() {
  if (State.settings.soundEnabled === false) return;
  try {
    beepCtx = beepCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = beepCtx.createOscillator();
    const g = beepCtx.createGain();
    o.connect(g); g.connect(beepCtx.destination);
    o.frequency.value = 880; g.gain.value = 0.2;
    o.start();
    setTimeout(() => { try { o.stop(); } catch(e){} }, 400);
    setTimeout(() => {
      const o2 = beepCtx.createOscillator(); const g2 = beepCtx.createGain();
      o2.connect(g2); g2.connect(beepCtx.destination);
      o2.frequency.value = 660; g2.gain.value = 0.2; o2.start();
      setTimeout(() => { try { o2.stop(); } catch(e){} }, 400);
    }, 500);
  } catch (e) {}
}

/* ---------- 闹钟轮询 ---------- */
function alarmLoop() {
  const now = new Date();
  const cur = pad2(now.getHours()) + ':' + pad2(now.getMinutes());
  (State.alarms || []).forEach(a => {
    if (!a.enabled) return;
    if (a.time === cur && a.firedFor !== cur) {
      a.firedFor = cur;
      beep();
      toast('⏰ 闹钟响！' + (a.label ? '（' + a.label + '）' : ''));
      try { new Notification('个人工作台', { body: '闹钟：' + (a.label || a.time) }); } catch(e){}
    }
  });
}
setInterval(alarmLoop, 60000);

/* ---------- 文件输入绑定 ---------- */
// 桌面背景（修复：覆盖 size/position 由 CSS 提供，此处仅设置图片）
$('#wallpaper-picker').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    State.settings.wallpaper = reader.result;
    applyWallpaper();
    toast('桌面背景已更换');
  };
  reader.readAsDataURL(f);
  e.target.value = '';
});
// 快照导入
$('#snapshot-import').addEventListener('change', e => {
  if (e.target.files[0]) importSnapshot(e.target.files[0]);
  e.target.value = '';
});

/* ---------- 快捷键 ---------- */
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const isTyping = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;
  // Ctrl+S 保存快照（任何时候响应）
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
    e.preventDefault();
    persistAll(true);
  }
  // 新建便签：改为 Ctrl+Alt+N（不占用浏览器 Ctrl+T）
  if ((e.ctrlKey || e.metaKey) && e.altKey && !e.shiftKey && e.key.toLowerCase() === 'n' && !isTyping) {
    e.preventDefault();
    Notes.create();
  }
});

/* ---------- 任务栏：后台模式指示器 ----------
 * ⚡ 显示 = 保持活跃（始终满速，切走再回来不卡顿）
 * 不显示 = 允许挂起（省资源，回来可能需热身）
 * 点击图标 = 切换（与 Alt+X 等效）
 */
const KeepAliveIndicator = {
  el: null,
  value: false,

  init() {
    this.el = $('#btn-keepalive');
    if (!this.el) return;
    this.el.addEventListener('click', (e) => {
      e.stopPropagation();
      this.toggle();
    });
    this.refresh();
  },

  /* 从主进程读取并更新显示 */
  async refresh() {
    if (!IS_ELECTRON || !window.electronAPI || !window.electronAPI.getKeepAlive) return;
    try {
      const r = await window.electronAPI.getKeepAlive();
      if (r && r.ok) this.apply(!!r.keepAlive);
    } catch (e) { /* 忽略 */ }
  },

  apply(v) {
    this.value = !!v;
    if (!this.el) return;
    this.el.style.display = this.value ? '' : 'none';
    this.el.title = this.value
      ? '后台模式：保持活跃（始终满速）· 点击切换为「允许挂起」'
      : '后台模式：允许挂起';
  },

  async toggle() {
    if (!IS_ELECTRON || !window.electronAPI || !window.electronAPI.applyKeepAlive) {
      toast('切换后台模式仅在 Electron 下可用');
      return;
    }
    // 传输进行中不重建，避免中断
    try {
      if (window.electronAPI.transferGetStatus) {
        const st = await window.electronAPI.transferGetStatus();
        if (st && st.current) { toast('文件传输进行中，暂不切换（避免中断传输）', 3200); return; }
      }
    } catch (e) { /* 忽略 */ }

    const next = !this.value;
    // 先保存快照，保证重建后布局能恢复
    try { if (typeof persistAll === 'function') persistAll(false); } catch (e) {}
    try {
      const r = await window.electronAPI.applyKeepAlive(next);
      // 正常情况下窗口会重建、本页被销毁，下面执行不到。
      // 但若重建被跳过或失败，必须让指示器与主进程保持一致，
      // 否则 ⚡ 会显示错误的状态，比"没有指示"更糟。
      if (r && typeof r.keepAlive === 'boolean') this.apply(r.keepAlive);
      else this.apply(next);
    } catch (e) {
      toast('切换失败：' + ((e && e.message) || e), 3200);
    }
  }
};

/* ---------- 任务栏按钮（修复：左上角图标 = 显示桌面，带反馈） ---------- */
$('#btn-music-pop').addEventListener('click', e => {
  e.stopPropagation();
  musicPopEl.classList.toggle('show');
});
$('#btn-show-desktop').addEventListener('click', () => {
  const hadWindows = Object.keys(WindowManager.windows).length > 0;
  WindowManager.showDesktop();
  if (hadWindows) toast('已显示桌面');
  else toast('桌面已经显示');
});

/* ---------- 初始化启动 ---------- */
function boot() {
  // 锁定内建应用 id（必须在加载任何外部插件之前），防止自定义 JS 静默顶掉内建应用
  BuiltinAppIds.clear();
  Object.keys(AppRegistry).forEach(k => BuiltinAppIds.add(k));
  applyTheme();
  applyWallpaper();
  renderDesktopIcons();
  MusicPlayer.init();
  Notes.init();
    if (IS_ELECTRON) Clips.init();
  // 后台模式指示器（重建窗口后需要重新同步显示）
  try { KeepAliveIndicator.init(); } catch (e) { /* 忽略 */ }
  // 加载快捷操作（Actions）并生成桌面图标
  if (IS_ELECTRON) {
    (async () => {
      await ActionsEngine.loadAll(State.settings.actionsJsDir);
      if (ActionsEngine.loadedActions.length) renderDesktopIcons(); // 桌面若需刷新（总入口本身已在桌面）
      if (ActionsEngine.errors.length) ActionsEngine.showErrorSummary();
    })();
  }
  // 恢复上次会话打开的窗口（仅当手动保存过窗口状态）
  if (State.windows.length) {
    State.windows.forEach(w => {
      if (getApp(w.appId)) {
        WindowManager.create(w.appId, { id: w.id, x: w.x, y: w.y, w: w.w, h: w.h });
      }
    });
  }
  // 首次使用：自动打开几个示例窗口
  if (!State._booted) {
    WindowManager.create('fileArea');
    WindowManager.create('notes');
    ['timer','alarm','music','clock'].forEach(id => { try { WindowManager.create(id); } catch(e){} });
    State._booted = true;
  }
  setTimeout(() => toast('欢迎使用个人工作台 · Ctrl+S 保存 · Ctrl+Alt+N 新建便签', 4500), 800);
}

/* ---------- 便签管理窗口应用 ---------- */
registerApp({
  id: 'notes',
  name: '便签管理',
  icon: '🗒️',
  w: 460, h: 500,
  render(body, meta) {
    const draw = () => {
      body.innerHTML = `
        <div class="row" style="margin-bottom:10px;">
          <button class="btn primary" id="nb-new">＋ 新建便签</button>
          <span style="font-size:12px;color:var(--text-dim);">鼠标移到某条上按 Del 可彻底删除</span>
        </div>
        ${State.notes.length ? '' : '<div style="color:var(--text-dim);text-align:center;padding:30px;">还没有便签，点上方新建</div>'}
        <div id="nb-list"></div>
      `;
      const newBtn = body.querySelector('#nb-new');
      if (newBtn) newBtn.addEventListener('click', () => Notes.create());
      const listBox = body.querySelector('#nb-list');
      if (listBox) renderList(listBox);
    };

    function renderList(box) {
      box.innerHTML = '';
      if (!State.notes.length) return;
      State.notes.forEach(note => {
        const item = document.createElement('div');
        item.className = 'note-list-item';
        item.dataset.noteId = note.id;
        const status = note.closed ? '（已关闭）' : '';
        item.innerHTML = `
          <span class="nl-tag">${esc(note.tags || '无标签')}${esc(status)}</span>
          <div class="nl-text">${esc(note.text || '（空）')}</div>
          <div class="nl-actions">
            ${note.closed
              ? '<button class="nl-open">↩ 恢复</button>'
              : '<button class="nl-close">🗕 关闭</button>'}
            <button class="nl-del">✖ 删除</button>
          </div>
        `;
        // 恢复 / 关闭
        item.querySelector('.nl-open')?.addEventListener('click', e => { e.stopPropagation(); Notes.open(note.id); });
        item.querySelector('.nl-close')?.addEventListener('click', e => { e.stopPropagation(); Notes.close(note.id); });
        item.querySelector('.nl-del')?.addEventListener('click', e => { e.stopPropagation(); Notes.remove(note.id); });
        // 单击列表项：若已关闭则恢复，若打开则聚焦桌面便签
        item.addEventListener('click', () => {
          if (note.closed) Notes.open(note.id);
          else {
            const meta = Notes.els.get(note.id);
            if (meta) Notes.bringToFront(note.id);
          }
        });
        // hover 高亮 + Del 彻底删除
        item.addEventListener('mouseenter', () => item.classList.add('note-delete-hover'));
        item.addEventListener('mouseleave', () => item.classList.remove('note-delete-hover'));
        item.addEventListener('keydown', e => {}); // 占位，便于聚焦
        box.appendChild(item);
      });
      Motion.stagger(box, '.note-list-item', 10);
    }

    // 全局监听：当鼠标悬停在某条便签列表项上时按 Del 彻底删除
    const onKey = (e) => {
      if (e.key !== 'Delete' && e.key !== 'Del') return;
      const hovered = document.querySelector('.note-list-item.note-delete-hover');
      if (hovered) {
        e.preventDefault();
        const id = hovered.dataset.noteId;
        Notes.remove(id);
      }
    };
    document.addEventListener('keydown', onKey);

    draw();
    Notes.managerRefresh = draw;
    meta.cleanup = () => {
      Notes.managerRefresh = null;
      document.removeEventListener('keydown', onKey);
    };
  }
});

// 启动
boot();

</script>
